# Secret scan for dm-orbit-gov-action (gitleaks). Config: .gitleaks.toml
name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          VERSION="8.30.1"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz

          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: gitleaks git --verbose --redact --config .gitleaks.toml .
