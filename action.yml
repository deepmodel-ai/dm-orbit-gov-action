name: 'Orbit Governance Evidence'
description: >
  Collect capped changed files and call hosted Orbit MCP validate_changed_files.
  LLM evaluation, control lookup, and scanner evidence writes run in Orbit API.
author: 'DeepModel'

inputs:
  orbit_scanner_token:
    description: 'Orbit scanner credential (orb_sc_…). Pass secrets.ORBIT_SCANNER_TOKEN — not vars.'
    required: true
  agent_spec_identifier:
    description: >-
      Capability UUID. Use with target_role. Pass secrets.ORBIT_AGENT_SPEC_IDENTIFIER
      (Secrets tab). Do not use vars.* for a value stored as a Secret.
    required: false
  target_role:
    description: 'CANDIDATE or PRODUCTION (default CANDIDATE).'
    required: false
    default: 'CANDIDATE'
  agent_spec_id:
    description: >-
      Pinned AgentSpec version UUID (alternative to identifier+role).
      Pass secrets.ORBIT_AGENT_SPEC_ID when using this form.
    required: false
  repository:
    description: 'Canonical github:owner/repo when credential is repo-scoped. Defaults from GITHUB_REPOSITORY.'
    required: false
  fail_on_required:
    description: 'If true, fail the job when any Required control has passed=false.'
    required: false
    default: 'true'
  source:
    description: 'Evidence source: ci | local'
    required: false
    default: 'ci'

outputs:
  controls_evaluated:
    description: 'Number of controls evaluated in this run.'
    value: ${{ steps.scan.outputs.controls_evaluated }}
  required_failed:
    description: 'Number of Required controls that failed.'
    value: ${{ steps.scan.outputs.required_failed }}
  tier:
    description: 'Tier key returned by Orbit validation.'
    value: ${{ steps.scan.outputs.tier }}
  results:
    description: 'JSON array of per-control results (passed + findings).'
    value: ${{ steps.scan.outputs.results }}
  raw_llm_output:
    description: 'Raw LLM JSON from Orbit.'
    value: ${{ steps.scan.outputs.raw_llm_output }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Orbit governance action
      shell: bash
      run: python -m pip install --upgrade pip && python -m pip install "${{ github.action_path }}"

    - name: Run Orbit governance evidence scan
      id: scan
      shell: bash
      env:
        INPUT_ORBIT_SCANNER_TOKEN: ${{ inputs.orbit_scanner_token }}
        INPUT_AGENT_SPEC_IDENTIFIER: ${{ inputs.agent_spec_identifier }}
        INPUT_TARGET_ROLE: ${{ inputs.target_role }}
        INPUT_AGENT_SPEC_ID: ${{ inputs.agent_spec_id }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_FAIL_ON_REQUIRED: ${{ inputs.fail_on_required }}
        INPUT_SOURCE: ${{ inputs.source }}
      run: python -m dm_orbit_gov_action

branding:
  icon: 'shield'
  color: 'blue'
